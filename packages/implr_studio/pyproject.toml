[project]
name = "implr-studio"
version = "0.1.0"
description = "Visual SDLC pipeline builder and orchestrator for implr"
requires-python = ">=3.11"
dependencies = [
    # The contract validator, reached only through implr_bridge. Phase -1 made it
    # a package, which is why this is a dependency rather than a path hack.
    "implr-validate",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
implr-studio = "implr_studio.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["implr_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
